version: '3.9'

# ========================================
# SERVICIOS
# ========================================

services:

  # ========================================
  # MINIO
  # ========================================
  minio-acme:
    image: minio/minio:latest
    container_name: minio-acme
    ports:
      - "9000:9000"
      - "9001:9001"
    restart: always
    env_file:
      - .env
    command: server /data --console-address ":9001"
    volumes:
      - acme_minio_data:/data
    networks:
      - as-sync-acme-network

  # ========================================
  # API
  # ========================================
  api-acme:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-acme
    ports:
      - "${LOCAL_MACHINE_PORT}:5000"
    restart: always
    env_file:
      - .env
    environment:
      DB_HOST: ${POSTGRES_GCI_HOST}
      DB_PORT: ${POSTGRES_GCI_PORT}
      DB_USER: ${POSTGRES_GCI_USER}
      DB_PASSWORD: ${POSTGRES_GCI_PASSWORD}
    depends_on:
      - minio-acme
    networks:
    # - proxy-network
    # - gci-db-network
      - as-sync-acme-network

volumes:
  acme_minio_data:

networks:
  as-sync-acme-network:
    driver: bridge