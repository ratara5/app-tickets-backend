# ============================================================
# VPS stack — app + TLS edge
#
# This file contains ONLY the components this project owns. The
# shared data-plane containers (postgres-gci, minio-acme) are NOT
# declared here on purpose: they are reused across tenants, so the
# deployment procedure creates them once and then leaves them alone
# (see docs/deployment-guide.md and the deploying-backend-vps skill).
#
# Topology (everything on the external network "infra-net"):
#
#   phone ──HTTPS──► caddy ──► api          (api.example.com)
#                 └─► minio-acme:9000       (media.example.com)
#   api ──postgres-gci:5432                  (no host port)
#   api ──► minio-acme:9000                   (internal dial, since 2026-09-29)
#
# MinIO is configured with TWO origins (TICKET-012, resolved):
#   MINIO_ENDPOINT / _PORT / _SECURE       where the API dials the store
#                                         -> minio-acme:9000, plain HTTP
#   MINIO_PUBLIC_ENDPOINT / _PORT / _SECURE  origin baked into presigned URLs
#                                         -> media.example.com:443, TLS
# Before the split, one value had to serve both, so the API's own uploads were
# routed out through Caddy and back via an in-network alias. That alias is no
# longer required for uploads; it is kept below so a not-yet-migrated
# configuration (MINIO_PUBLIC_ENDPOINT unset -> falls back to the internal
# value) still resolves media.example.com from inside the network.
#
# Publishing rules:
#   - caddy is the ONLY service with public ports (80/443).
#   - api is published on 127.0.0.1 only (Caddy reaches it by name).
#   - postgres and minio publish nothing. Their host ports belong to
#     other tenants and ufw does not filter docker-published ports.
# ============================================================

name: app-tickets-vps

services:
  # ------------------------------------------------------------
  # API — FastAPI on the shared network, addressed by container name
  # ------------------------------------------------------------
  api-acme:
    build:
      context: ../..
      dockerfile: Dockerfile
    image: app-tickets-backend:vps
    container_name: api-acme
    restart: unless-stopped
    # Container side must be 8000: that is what the image binds
    # (Dockerfile CMD `gunicorn --bind 0.0.0.0:8000`, and EXPOSE 8000). It was
    # mapped to 5000, so nothing was ever listening on the published port and the
    # container was unreachable from the host despite starting normally.
    ports:
      - "127.0.0.1:8000:8000"
    # Single source of truth for configuration: `env_file` supplies everything,
    # and `environment:` below states only the values that MUST differ inside a
    # container. `environment:` outranks `env_file:`, so an unset
    # `${POSTGRES_GCI_*}` here once overrode the correct DB_HOST from .env with
    # an empty string and the API started with no database host at all. Each key
    # below is therefore a literal, never an unexpanded variable.
    env_file:
      - ../../.env
    environment:
      # Container name resolution works only inside a docker network.
      # This is the same value the ETL uses with `docker exec`.
      # These two override .env on purpose: inside a container, the container
      # name is resolvable and 127.0.0.1 is the container itself.
      DB_HOST: postgres-gci
      DB_PORT: "5432"
      TEMPLATES_DIR: /srv/app/templates/reports
      CHUNK_DIR: /tmp/upload_chunks
      # ------------------------------------------------------------
      # MinIO, pinned for THIS stack rather than inherited.
      #
      # `env_file: ../../.env` above is the host-run configuration file, where
      # MINIO_ENDPOINT is 127.0.0.1 because there the API and MinIO share the
      # host. Inside this container 127.0.0.1 is the container itself, so
      # inheriting it points every upload and the startup bucket probe at
      # nothing. The two run modes need opposite values from the same key, so
      # the container values are stated here, where the network that resolves
      # them is also declared.
      #
      # The public origin must be MEDIA_DOMAIN, not a LAN address: it is signed
      # into every pre-signed URL, and Caddy is the only thing serving that host
      # (see Caddyfile). Setting it to an address that answers nothing produces
      # URLs that return 404 rather than an error at signing time.
      MINIO_ENDPOINT: minio-acme
      MINIO_PORT: "9000"
      MINIO_SECURE: "false"
      # MEDIA_DOMAIN, never a container name or a LAN address: this value is signed
      # into every presigned URL, and Caddy is the only public listener for that
      # host. It is `:?`-guarded so a missing value fails at compose time with a
      # readable message instead of producing URLs that 404 at request time.
      MINIO_PUBLIC_ENDPOINT: ${MEDIA_DOMAIN:?set MEDIA_DOMAIN in .env}
      MINIO_PUBLIC_PORT: "443"
      MINIO_PUBLIC_SECURE: "true"
    # Chunked uploads stage on local disk before reaching MinIO.
    # Without a volume a restart loses every in-flight upload while
    # its database rows survive.
    volumes:
      - api-upload-chunks:/tmp/upload_chunks
    depends_on:
      caddy:
        condition: service_started
    # It's possible alternatively: each app has its own minio container; in this case: 
    # 1. create minio service in this same compose file, 2. add minio service to the 
    # same new internal network as api-acme, 3. set MINIO_ENDPOINT=minio in the environment of api-acme.
    # Joins the same external network as caddy and migrate. This was
    # `name: my-dopamine-network`, which contradicted the top-level declaration
    # of infra-net and split the stack: the API would have reached Postgres and
    # MinIO on one network while Caddy reached them on another. my-dopamine is
    # also provider-frontend's bridge (docs/deployment-guide.md §2.1.1), so
    # joining it would put this app's database traffic on another tenant's
    # network.
    networks:
      - infra-net
      # aliases:
        # - api

  # ------------------------------------------------------------
  # migrate — ONE-SHOT JOB, never a service
  # ------------------------------------------------------------
  # Invoke as:  docker compose run --rm migrate
  #
  # `run --rm` is the whole point. This entry is never started with `up`, and
  # `restart: "no"` is not optional: a supervised migration that fails would
  # restart-loop and re-attempt DDL against postgres-gci, which is shared with
  # other applications. One failure must stop, not become a self-inflicted
  # outage for other tenants.
  #
  # It builds the `migrate` target of the SAME Dockerfile as `api`, so the
  # migration always runs the same app/models the API will run.
  #
  # It publishes no port and declares no healthcheck: a job has no traffic to
  # receive and no uptime to supervise.
  #
  # NOT YET THE DEPLOYMENT PATH: the models are stale against the live database
  # (`alembic check` reports 94 pending operations, TICKET-019), so autogenerate
  # would still write a destructive revision. `alembic upgrade head` itself is
  # now sound: one head, a single `0001_baseline` that creates nothing, plus
  # `0002_widen_uom_factor`. Keep using docs/deployment-guide.md §2.2 until the
  # model drift is fixed.
  #
  # CREDENTIALS. This job needs schema-modification rights, so it cannot use the
  # application's runtime credentials — the runtime role holds DML only and is
  # deliberately never given ownership (infra/provision/README.md). It has no
  # `env_file` for that reason: the elevated values must be passed explicitly, by
  # hand, so that an elevated credential is never a default in a file that also
  # configures the running service. Run it as, for example:
  #
  #   docker compose run --rm -e DB_USER=<admin-user> -e DB_PASSWORD=<admin-password> migrate
  #
  # Supplying only DB_HOST and DB_PORT leaves it to read the ambient environment,
  # which will fail the migration rather than silently do it with the wrong role.
  migrate:
    build:
      context: ../..
      dockerfile: Dockerfile
      target: migrate
    image: app-tickets-backend:vps-migrate
    restart: "no"
    environment:
      # Same value the API and the ETL use: container-name resolution only works
      # inside a docker network.
      DB_HOST: postgres-gci
      DB_PORT: "5432"
    networks:
      - infra-net

  # ------------------------------------------------------------
  # Caddy — automatic TLS for the API and the media host
  # ------------------------------------------------------------
  caddy:
    image: caddy:2.10-alpine
    container_name: caddy-app-tickets
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:?set API_DOMAIN in .env}
      MEDIA_DOMAIN: ${MEDIA_DOMAIN:?set MEDIA_DOMAIN in .env}
      # Required: Caddy will not start with an empty address, so fail here with a clear message.
      ACME_EMAIL: ${ACME_EMAIL:?ACME_EMAIL is required - set it in .env or the environment}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      infra-net:
        aliases:
          # The API signs media URLs with MEDIA_DOMAIN. This alias
          # lets the API reach Caddy under that exact name over the
          # private network, so uploads do not depend on public DNS
          # or on NAT hairpinning. Phones still resolve the public
          # A record. Signature host == client Host in both cases.
          - ${MEDIA_DOMAIN:?set MEDIA_DOMAIN in .env}
          - ${API_DOMAIN:?set API_DOMAIN in .env}

volumes:
  api-upload-chunks:
  caddy-data:
  caddy-config:

networks:
  infra-net:
    # Created once by the deployment procedure and shared with the
    # other tenants' containers. `docker compose` must not own it.
    external: true
    name: infra-net
    # PREREQUISITE, enforced by nothing here: `minio-acme` and
    # `postgres-gci` must ALREADY be attached to infra-net.
    #
    #   docker network inspect infra-net --format '{{range .Containers}}{{.Name}} {{end}}'
    #
    # Compose cannot attach a container it does not own. Moving minio-acme
    # into its own compose project therefore did not move it onto infra-net:
    # it came up on that project's own prefixed network instead
    # (`assync_as-sync-acme-network`), and from here `minio-acme` does not
    # resolve. Both media downloads and uploads then fail with a DNS error,
    # while the API itself starts and looks healthy - the failure only appears
    # on the first request that touches storage.
    #
    # Attach it once, from whichever project owns the container:
    #   docker network connect infra-net minio-acme
    # and record that step in the deployment procedure so it survives a
    # recreate of the MinIO container.
